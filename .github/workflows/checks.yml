# Reusable checks – called by pr.yml and db-deploy.yml (same pattern as RUR's test.yml).
name: checks

on:
  workflow_call:

permissions:
  contents: read

env:
  # Build/test-time placeholders only. Real values live in Vercel and GitHub Environments.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations and seed
        run: supabase db reset
      - name: pgTAP tests
        run: |
          if ls supabase/tests/*.sql >/dev/null 2>&1; then
            supabase test db
          else
            echo "::notice::No database tests yet (supabase/tests/*.sql)"
          fi
      - name: Generated types are up to date
        run: |
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then
            supabase gen types typescript --local > /tmp/database.ts
            if ! diff -q /tmp/database.ts src/types/database.ts >/dev/null; then
              echo "::error::src/types/database.ts is out of date. Run: npm run db:reset && npm run db:types"
              exit 1
            fi
          fi

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
