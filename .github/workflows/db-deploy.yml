# Applies Supabase migrations to the environment that matches the branch
# (same idea as RUR's dev.yml / staging.yml / prod.yml).
#   dev     → GitHub Environment "dev"        → Supabase project nwp-works-dev
#   staging → GitHub Environment "staging"    → Supabase project nwp-works-staging
#   main    → GitHub Environment "production" → Supabase project nwp-works-prod (required reviewer)
# Vercel deploys the Next.js app itself through its GitHub integration.
#
# Setup (Member 4):
#   Repository secret:  SUPABASE_ACCESS_TOKEN
#   Environment secrets (dev, staging, production): SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
name: db-deploy

on:
  push:
    branches: [dev, staging, main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  migrate:
    name: Push migrations
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Skip if this environment is not configured yet
        id: guard
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Supabase secrets not set for this environment – skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Link project
        if: steps.guard.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        if: steps.guard.outputs.skip != 'true'
        run: supabase db push --dry-run
      - name: Apply migrations
        if: steps.guard.outputs.skip != 'true'
        run: supabase db push
